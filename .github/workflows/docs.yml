---
name: Deploy Documentation to GitHub Pages

on:
    # Runs on pushes targeting the default branch
    push:
        branches:
            - master

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
    contents: read
    pages: write
    id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
    group: 'pages'
    cancel-in-progress: false

jobs:
    build:
        name: Build Documentation
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # latest
              with:
                  cmakeVersion: 4.4.2
                  ninjaVersion: 1.13.2

            - name: Install build tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y doxygen graphviz

            - name: Configure CMake
              run: cmake --preset release -DFERS_BUILD_DOCS=ON -DFERS_DOCS_ONLY=ON

            - name: Build documentation
              run: cmake --build --preset release --target doc

            - name: Upload artifact
              uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
              with:
                  path: './build/release/docs/html'

    deploy:
        name: Deploy to GitHub Pages
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-24.04
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
